<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8efe5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ひねくれテディのFP特訓">
  <title>ひねくれテディのFP特訓</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">

  <style>
    :root{
      --bg:#f8efe5;
      --ink:#4f453f;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:var(--bg);overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:var(--ink)}
    .app-shell{
      position:fixed;
      inset:0;
      width:100%;
      height:100dvh;
      background:var(--bg);
    }
    .app-frame{
      display:block;
      width:100%;
      height:100%;
      border:0;
      margin:0;
      padding:0;
      background:var(--bg);
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <iframe
      class="app-frame"
      src="https://script.google.com/macros/s/AKfycbyDYNpNMCWrBIzEfMfIQJBdfy_SAkjnI4JkAir93VPqqfVn8XrGviMEgoaEjyzq6iMAQg/exec"
      title="ひねくれテディのFP特訓"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </main>
</body>
</html>
