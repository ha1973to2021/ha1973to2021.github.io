<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ひねくれメーター</title>

  <meta name="theme-color" content="#f5b400">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ひねくれメーター">

  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff8df;
      color: #222;
    }
    .box {
      text-align: center;
      padding: 28px;
    }
    .icon {
      width: 120px;
      height: 120px;
      border-radius: 26px;
      margin-bottom: 14px;
    }
    a {
      display: inline-block;
      margin-top: 14px;
      padding: 12px 20px;
      border-radius: 12px;
      background: #f5b400;
      color: #111;
      text-decoration: none;
      font-weight: 700;
    }
  </style>

  <script>
    // ホーム画面から起動したときだけGASへ自動移動。
    // Safariで開いたときはGitHub Pagesに留まり、
    // apple-touch-iconを認識した状態で「ホーム画面に追加」できる。
    window.addEventListener("load", function () {
      const standalone =
        window.navigator.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches;

      if (standalone) {
        window.location.replace("https://script.google.com/macros/s/AKfycbz5NYB1ontPowNTSQjhDDkHz0ejKKqAdMnBeFmUun3NXQM84UH1VPC3fY_9XbXg0NRE/exec");
      }
    });
  </script>
</head>

<body>
  <main class="box">
    <img class="icon" src="./icon-180.png" alt="ひねくれメーター">
    <h1>ひねくれメーター</h1>
    <p>このページを「ホーム画面に追加」してください。</p>
    <a href="https://script.google.com/macros/s/AKfycbz5NYB1ontPowNTSQjhDDkHz0ejKKqAdMnBeFmUun3NXQM84UH1VPC3fY_9XbXg0NRE/exec">ブラウザでアプリを開く</a>
  </main>
</body>
</html>
